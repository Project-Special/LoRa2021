; Envs do protótipo LoRa2021.
; Copiado para ExpressLRS/src/targets/lora2021.ini por setup_hardware.py, que
; também registra o arquivo em extra_configs do platformio.ini.
;
; Só existem pra amarrar o `board_config`: sem ele o passo de pós-build
; (UnifiedConfiguration.appendConfiguration) abre um menu interativo pedindo o
; target, o que quebra build automatizado / CI.

[env:LoRa2021_TX]
extends = env:Unified_ESP32_LR2021_TX_via_UART
board_config = lora2021.tx_dual.esp32

[env:LoRa2021_RX]
extends = env:Unified_ESP32_LR2021_RX_via_UART
board_config = lora2021.rx_dual.esp32
