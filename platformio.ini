; -----------------------------------------------------------------------------
; LoRa2021 (Semtech LR2021) dual-band prototype - ESP32, driver proprio
;
; Module: G-NiceRF LoRa2021 / Waveshare Core2021 / Seeed Wio-LR2021
; Radio : Semtech LR2021 - Sub-GHz (150..1090 MHz), S-band (1900..2200 MHz)
;         and 2.4 GHz ISM (2400..2500 MHz)
;
; Build both nodes from the same source; they ping-pong automatically and
; expose a serial console (420000 8N1) for live band/modem changes.
; -----------------------------------------------------------------------------

[platformio]
; Duas placas, o mesmo src/ e lib/ — só muda a pinagem e a partition table.
; Na bancada agora está o WROOM-32 clássico; pro S3: pio run -e esp32s3
default_envs = esp32dev

[env]
framework = arduino
; UM baud para o projeto inteiro: 420000.
;
; Nao e escolha estetica. O receptor ExpressLRS emite CRSF a 420000 e isso e
; fixo — nao da para mudar do lado dele. Manter a bancada em 115200 obrigava
; cada ferramenta a adivinhar com quem estava falando, e errar o baud produz
; uma tela de lixo que parece defeito de hardware.
;
; De quebra sai mais barato: a 115200 uma linha de 90 caracteres custa ~8 ms de
; CPU; a 420000, ~2 ms. Com telemetria a 1 Hz isso e folga que volta para o
; radio.
;
; Efeito colateral conhecido: as mensagens da ROM do ESP32 no boot saem sempre
; a 115200 e viram lixo no monitor. Sao 3 linhas antes do firmware assumir.
monitor_speed = 420000
monitor_filters = esp32_exception_decoder, time
; Sem lib_deps de proposito: o driver do LR2021 vive em lib/LR2021, escrito
; sobre os comandos do fabricante. Nada externo pra baixar, e o modo de fallback
; do chip fica sob nosso controle — ver o cabecalho de LR2021Chip.h.
; O painel web mora em data/ e é servido do LittleFS.
;   pio run -t uploadfs    grava data/ na placa
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Uma definicao so, consumida por src/main.cpp. Trocar aqui muda tudo.
    -D SERIAL_BAUD=420000
    ; --- logs no serial (420000) -----------------------------------------
    ; 3 = info do core do ESP32 (WiFi, LittleFS). Use 5 pra tudo, 0 pra calar.
    -D CORE_DEBUG_LEVEL=3
    ; --- opções do módulo LoRa2021 ---------------------------------------
    ; MEDIDO nesta placa (comando `tcxo scan`): o módulo NÃO tem TCXO, apesar
    ; de trazer o pino VTCXO no header — o oscilador não está populado. Com
    ; qualquer tensão de TCXO o chip responde por SPI mas a calibração falha
    ; com device error 0x2081. Com 0 o rádio sobe.
    -D LR2021_TCXO_VOLTAGE=0.0f
    ; O módulo NÃO tem pino "IRQ": ele expõe DIO7, DIO8 e DIO9 crus, e qual
    ; deles vira interrupção é escolhido por SPI. DIO9 é o default do driver
    ; da Semtech, então é o de menos atrito. Ligue DIO9 -> PIN_LORA_IRQ.
    -D LR2021_IRQ_DIO_NUM=9
    ; Frase de binding do transmissor ExpressLRS. Só é usada no MODO ESCUTA,
    ; pra derivar o UID e daí a inversão de IQ (UID[5] & 1) — mesmo cálculo do
    ; ExpressLRS e do IHM: o MD5 é da string do build flag inteira, não da
    ; frase pura.
    -D BIND_PHRASE=\"Paulo_Palaoro\"
    ; Banda no boot: 0=150 1=433 2=470 3=868 4=915 5=S-band 6=2G4
    ; Banda do primeiro instante do boot. Na prática o par de teste (`peer`,
    ; gravado na NVS) reconfigura o rádio logo em seguida — este número só
    ; aparece se aquele passo falhar.
    -D DEFAULT_BAND_INDEX=6
    ; --- banda do enlace --------------------------------------------------
    ; UMA linha decide a banda das duas placas. Trocar aqui e regravar basta —
    ; o valor sobrepoe o que estiver na NVS, entao nao ha risco de uma placa
    ; ficar numa banda e a outra noutra, que e a falha mais chata de achar:
    ; um lado transmite, o outro escuta, e nada acontece sem erro nenhum.
    ;
    ;   PEER_ELRS_2G4   escutar/simular ExpressLRS 2.4 GHz  (2441,4 MHz)
    ;   PEER_BENCH_2G4  enlace proprio em 2.4 GHz           (2441,4 MHz)
    ;   PEER_BENCH_433  enlace proprio em 433 MHz           (433,0 MHz)
    ;   PEER_BENCH      enlace proprio em 915 MHz           (915,0 MHz)
    ;   PEER_ELRS_900   escutar ExpressLRS 900 MHz          (922,1 MHz)
    ;
    ; Comente a linha pra devolver a escolha ao comando `peer` e a NVS.
    -D LINK_PEER=PEER_BENCH_433

    ; --- teste de alcance -------------------------------------------------
    ; O LED de status e por env: o pino livre nao e o mesmo nas duas placas.
    ; 4 quadros por segundo. O papel de cada placa vem do env (abaixo) e pode
    ; ser trocado em runtime pelo comando `role`, que grava na NVS.
    -D RANGE_INTERVAL_MS=250

; -----------------------------------------------------------------------------
; ESP32-WROOM-32 clássico — DevKit v1 de 30 pinos
;
; Os 7 sinais saem em fila única no header direito, D13..D32, pulando só o D12
; (strapping MTDI: se o BUSY do módulo estiver alto no boot, a placa não sobe).
; Justificativa pino a pino em docs/PINOUT.md.
;
;   D13 -> MOSI      D26 -> NSS
;   D12 -- PULAR     D25 -> RST
;   D14 -> SCK       D33 -> BUSY
;   D27 -> MISO      D32 -> DIO9 (IRQ)
;
; Não são os pinos nativos da VSPI/HSPI: no ESP32 a matriz de GPIO roteia SPI
; pra qualquer pino, e a 8 MHz o caminho pela matriz não custa nada.
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
; A tabela default do esp32dev deixa 1,25 MB pro app — apertado com WiFi +
; WebServer + rádio. min_spiffs dá 1,9 MB de app e 128 kB de FS; data/ ocupa
; ~52 kB, então sobra folga dos dois lados. O S3 usa a tabela default da placa
; dele, que já é maior — por isso o ajuste só aparece aqui.
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    ; Papel de fábrica: esta placa é a RECEPTORA do teste de alcance.
    ; O LED azul conta o estado de longe, sem notebook aberto:
    ;   apagado = modulo LoRa2021 nao encontrado
    ;   aceso   = radio ok, esperando o par
    ;   piscando= enlace vivo
    ; GPIO2 e o LED de bordo da DevKit v1 e esta livre nesta pinagem.
    -D PIN_STATUS_LED=2
    -D PIN_LORA_MOSI=13
    -D PIN_LORA_SCK=14
    -D PIN_LORA_MISO=27
    -D PIN_LORA_NSS=26
    -D PIN_LORA_RST=25
    -D PIN_LORA_BUSY=33
    -D PIN_LORA_IRQ=32

; -----------------------------------------------------------------------------
; ESP32-S3 DevKitC-1
;
; Pinagem IGUAL à do SX1280 na IHM (Telas/lora_lrs.json), pra o LoRa2021 entrar
; na mesma fiação sem refazer nada. O único fio que muda de destino é o da
; interrupção: no SX1280 saía do DIO1 dele, aqui sai do DIO9 do módulo.
; -----------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D PIN_LORA_SCK=40
    -D PIN_LORA_MISO=38
    -D PIN_LORA_MOSI=41
    -D PIN_LORA_NSS=39
    -D PIN_LORA_RST=42
    -D PIN_LORA_BUSY=1
    -D PIN_LORA_IRQ=2
    ; Papel de fábrica: o S3 é o TRANSMISSOR do teste de alcance.
    -D RANGE_ROLE_TX
    ; Sem PIN_STATUS_LED de propósito: o GPIO2 do S3 já leva o IRQ do módulo, e
    ; o LED de bordo do DevKitC-1 é um WS2812 endereçável, que não acende com
    ; digitalWrite. Sem a flag o módulo de LED vira no-op. Para ter status aqui,
    ; solde um LED comum num pino livre e defina o pino nesta linha.
    ; A placa liga por ponte CH340 (UART0), não pelo USB nativo do S3. Com
    ; CDC_ON_BOOT=1 o `Serial` sai pelo USB nativo e o monitor no CH340 fica
    ; mudo — que é o oposto do que se quer num bring-up.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
